name: Build & publish api image

on:
  push:
    branches: [main]
    paths:
      - "packages/api/**"
      - "packages/agent/genmon_agent.py" # bundled into the api image for GET /devices/agent/download
      - ".github/workflows/api.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/api/**"
      - "packages/agent/genmon_agent.py"
      - ".github/workflows/api.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/jgoldenally/genmonitoring-api

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=pr

      - uses: docker/build-push-action@v6
        with:
          # Build context is the REPO ROOT, not packages/api -- the
          # Dockerfile also COPYs packages/agent/genmon_agent.py so
          # GET /devices/agent/download has something to serve. See the
          # comment at the top of packages/api/Dockerfile.
          context: .
          file: packages/api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
