name: Build & publish portal image

on:
  push:
    branches: [main]
    paths:
      - "packages/portal/**"
      - ".github/workflows/portal.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/portal/**"
      - ".github/workflows/portal.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/genmonitoring-portal

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=pr

      - uses: docker/build-push-action@v6
        with:
          # Do NOT pass a real --build-arg NEXT_PUBLIC_API_URL here -- the
          # published image deliberately keeps the Dockerfile's placeholder
          # baked in, and docker-entrypoint.sh rewrites it from the
          # NEXT_PUBLIC_API_URL env var at container start on whatever host
          # runs the image (see packages/portal/Dockerfile). Baking a real
          # URL in at this build step would defeat that and freeze the
          # image to one deployment's URL.
          context: packages/portal
          file: packages/portal/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
