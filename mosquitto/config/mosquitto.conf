# GenMonitoring local/dev Mosquitto configuration.
#
# Uses the stock dynamic-security plugin (shipped in eclipse-mosquitto:2.x)
# for MQTT credential/ACL management instead of AetherLynk's docker.sock +
# mosquitto_passwd + SIGHUP approach. The api container administers clients
# and roles entirely over MQTT control messages (see
# packages/api/app/services/mosquitto_dynsec.py) -- no docker.sock mount
# needed anywhere.
#
# Before first start, run ./mosquitto/bootstrap-dynsec.sh once to generate
# dynamic-security.json with an initial admin account (used as the api's
# MQTT_USERNAME/MQTT_PASSWORD) and a restricted "genmon-bridge" account.

per_listener_settings false

listener 1883
allow_anonymous false

# Production: terminate TLS here (or in front of Mosquitto with a reverse
# proxy) and listen on 8883 instead. Example (uncomment and supply real
# certs mounted into the container):
# listener 8883
# cafile /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/config/dynamic-security.json

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
