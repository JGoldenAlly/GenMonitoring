# GenMonitoring Mosquitto configuration.
#
# Runs plaintext on 1883 by deliberate choice for this deployment -- see
# the README's security note before exposing this port on the open
# internet. Anyone who can observe or reach 1883 in the clear can read
# device credentials and the start/stop command channel in plaintext, so
# whatever network path field agents use to reach mqtt.allyoperations.com
# (firewalled to known agent egress IPs, a private APN/VPN backhaul, etc.)
# is doing the job TLS would otherwise do -- treat it as load-bearing, not
# optional.
#
# Uses the stock dynamic-security plugin (shipped in eclipse-mosquitto:2.x)
# for MQTT credential/ACL management instead of AetherLynk's docker.sock +
# mosquitto_passwd + SIGHUP approach. The api container administers clients
# and roles entirely over MQTT control messages (see
# packages/api/app/services/mosquitto_dynsec.py) -- no docker.sock mount
# needed anywhere.
#
# Before first start, run ./mosquitto/bootstrap-dynsec.sh once to generate
# dynamic-security.json with an initial admin account (used as the api's
# MQTT_USERNAME/MQTT_PASSWORD) and a restricted "genmon-bridge" account.

per_listener_settings false

listener 1883
allow_anonymous false

# Optional hardening: terminate TLS here (or in front of Mosquitto with a
# TCP/SNI-passthrough proxy -- a plain HTTP reverse proxy can't front raw
# MQTT) and listen on 8883 instead of/alongside 1883. Example (uncomment
# and supply real certs mounted into the container, then set MQTT_TLS=true
# and MQTT_PORT=8883 on the api/bridge containers and in every field
# agent's device.conf):
# listener 8883
# cafile /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/config/dynamic-security.json

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
